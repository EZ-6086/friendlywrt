name: FriendlyWrt Build

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Build FriendlyWrt
        run: |
          # 确保进入正确目录
          cd friendlywrt  # 假设仓库根目录为friendlywrt
          ./build.sh rk3328.mk

      - name: Extract DTS/DTB
        run: |
          mkdir -p artifacts/dtb
          cp out/rk3328-nanopi-r2c-plus.dtb artifacts/dtb/

          dtc -I dtb -O dts -o artifacts/dts/rk3328-nanopi-r2c-plus.dts artifacts/dtb/rk3328-nanopi-r2c-plus.dtb

      - name: Upload Artifacts
        uses: actions/upload-artifacts@v4
        with:
          name: friendlywrt-r2cplus-configs
          path: artifacts/
          retention-days: 30
